<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Setup — Parliament of Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a3a6b;--green:#2e7d32;--green-dark:#1b5e20;--red:#c62828;--gold:#C9A84C;--cream:#f5f6f8;--white:#fff;--border:#d1d9e6;--text:#1a2332;--text-mid:#3d4a5c;--text-light:#6b7a8d}
body{font-family:'Source Sans 3','Segoe UI',sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{background:var(--white);border-radius:12px;width:100%;max-width:500px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.box-top{background:linear-gradient(135deg,var(--navy),#2a4f8f);padding:2rem;text-align:center}
.box-icon{font-size:2.5rem;margin-bottom:.75rem}
.box-title{font-family:'Libre Baskerville',Georgia,serif;font-size:1.4rem;color:#fff;margin-bottom:.35rem}
.box-sub{font-size:.8rem;color:rgba(255,255,255,.55);line-height:1.5}
.gold-line{height:3px;background:var(--gold)}
.box-body{padding:2rem}
.alert{border-radius:6px;padding:.75rem 1rem;font-size:.83rem;margin-bottom:1.25rem;display:none}
.alert.show{display:block}
.alert.error{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.alert.success{background:#f0fdf4;color:var(--green-dark);border:1px solid #bbf7d0}
.warn-box{background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:.85rem 1rem;font-size:.8rem;color:#7c5a00;margin-bottom:1.25rem;display:flex;gap:.6rem;align-items:flex-start;line-height:1.55}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--text-mid);margin-bottom:.4rem}
.field input{width:100%;padding:.72rem 1rem;border:1.5px solid var(--border);border-radius:6px;font-size:.9rem;font-family:inherit;color:var(--text);background:#fafbfc;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--navy);background:#fff}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.pw-wrap{position:relative}.pw-wrap input{padding-right:2.8rem}
.pw-eye{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--text-light)}
.btn{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:.5rem}
.btn:hover{background:var(--green-dark)}.btn:disabled{opacity:.6;cursor:not-allowed}
.done-screen{text-align:center;padding:1rem}
.done-icon{font-size:3rem;margin-bottom:1rem}
.done-title{font-family:'Libre Baskerville',Georgia,serif;font-size:1.25rem;color:var(--text);margin-bottom:.5rem}
.done-sub{font-size:.85rem;color:var(--text-light);line-height:1.65;margin-bottom:1.25rem}
.btn-link{display:inline-block;background:var(--navy);color:#fff;padding:.75rem 2rem;border-radius:6px;text-decoration:none;font-weight:700;font-size:.88rem}
.locked-screen{text-align:center;padding:1rem}
.locked-icon{font-size:3rem;margin-bottom:1rem}
.locked-title{font-family:'Libre Baskerville',Georgia,serif;font-size:1.25rem;color:var(--text);margin-bottom:.5rem}
.locked-sub{font-size:.85rem;color:var(--text-light);line-height:1.65;margin-bottom:1.25rem}
.loading-msg{text-align:center;padding:2rem;color:var(--text-light)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="box-top">
    <div class="box-icon">🔐</div>
    <div class="box-title">Administrator Setup</div>
    <div class="box-sub">Parliament of Kenya — Intern & Attachment Portal<br>One-time system setup. Keep this link private.</div>
  </div>
  <div class="gold-line"></div>
  <div class="box-body" id="body">
    <div class="loading-msg">Checking system status…</div>
  </div>
</div>

<script>
const API = 'https://parliament-intern-api.onrender.com/api';

async function init() {
  try {
    const res  = await fetch(`${API}/auth/setup-status`);
    const data = await res.json();
    if (data.setupNeeded) renderForm();
    else renderLocked();
  } catch(e) {
    document.getElementById('body').innerHTML = `<div class="alert error show">⚠️ Cannot reach server. Make sure the backend is running, then refresh.</div><button class="btn" onclick="init()" style="margin-top:0">Retry</button>`;
  }
}

function renderLocked() {
  document.getElementById('body').innerHTML = `
    <div class="locked-screen">
      <div class="locked-icon">🔒</div>
      <div class="locked-title">Setup Already Complete</div>
      <div class="locked-sub">An administrator account already exists.<br>This setup page is now permanently disabled for security.</div>
      <a href="admin-portal.html" class="btn-link">Go to Admin Portal →</a>
    </div>`;
}

function renderForm() {
  document.getElementById('body').innerHTML = `
    <div class="warn-box">⚠️ <span>This is a one-time setup page. Keep this URL private — only the system administrator should have access to it. It will be locked after use.</span></div>
    <div class="alert" id="alert"></div>
    <div class="grid-2">
      <div class="field"><label>First Name *</label><input type="text" id="firstName" placeholder="First name"></div>
      <div class="field"><label>Last Name *</label><input type="text" id="lastName" placeholder="Last name"></div>
    </div>
    <div class="field"><label>Email Address *</label><input type="email" id="email" placeholder="admin@parliament.go.ke"></div>
    <div class="field"><label>Phone Number *</label><input type="tel" id="phone" placeholder="+254 7xx xxx xxx"></div>
    <div class="field"><label>Staff ID / ID Number *</label><input type="text" id="idNumber" placeholder="e.g. ADMIN-001"></div>
    <div class="field"><label>Password * (min 8 characters)</label>
      <div class="pw-wrap"><input type="password" id="password" placeholder="Strong password"><button class="pw-eye" type="button" onclick="eye('password',this)">👁</button></div>
    </div>
    <div class="field"><label>Confirm Password *</label>
      <div class="pw-wrap"><input type="password" id="confirmPw" placeholder="Repeat password"><button class="pw-eye" type="button" onclick="eye('confirmPw',this)">👁</button></div>
    </div>
    <div class="field"><label>Setup Key * <span style="font-size:.72rem;color:var(--text-light)">(provided by ICT)</span></label>
      <div class="pw-wrap"><input type="password" id="setupKey" placeholder="Enter setup key"><button class="pw-eye" type="button" onclick="eye('setupKey',this)">👁</button></div>
    </div>
    <button class="btn" id="submitBtn" onclick="submit()">Create Administrator Account</button>`;
}

function eye(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type==='password'?'text':'password';
  btn.textContent = el.type==='password'?'👁':'🙈';
}

function showAlert(msg) {
  const el = document.getElementById('alert');
  if(el){ el.className='alert error show'; el.textContent=msg; el.scrollIntoView({behavior:'smooth'}); }
}

async function submit() {
  const firstName  = document.getElementById('firstName')?.value.trim();
  const lastName   = document.getElementById('lastName')?.value.trim();
  const email      = document.getElementById('email')?.value.trim();
  const phone      = document.getElementById('phone')?.value.trim();
  const idNumber   = document.getElementById('idNumber')?.value.trim();
  const password   = document.getElementById('password')?.value;
  const confirmPw  = document.getElementById('confirmPw')?.value;
  const setupKey   = document.getElementById('setupKey')?.value;

  if(!firstName||!lastName||!email||!phone||!idNumber||!password||!setupKey){ showAlert('All fields are required.'); return; }
  if(password.length<8){ showAlert('Password must be at least 8 characters.'); return; }
  if(password!==confirmPw){ showAlert('Passwords do not match.'); return; }
  if(!email.includes('@')){ showAlert('Please enter a valid email address.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Creating account…';

  try {
    const res  = await fetch(`${API}/auth/setup`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({firstName,lastName,email,password,phone,idNumber,setupKey}) });
    const data = await res.json();
    if(!res.ok){ btn.disabled=false; btn.textContent='Create Administrator Account'; showAlert(data.message||'Setup failed.'); return; }

    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('user', JSON.stringify(data.user));

    document.getElementById('body').innerHTML = `
      <div class="done-screen">
        <div class="done-icon">✅</div>
        <div class="done-title">Administrator Account Created!</div>
        <div class="done-sub">Your admin account has been set up successfully.<br>This setup page is now permanently locked.<br>Redirecting to the admin portal…</div>
      </div>`;
    setTimeout(()=>{ window.location.href='admin-portal.html'; }, 2500);
  } catch(e) {
    btn.disabled=false; btn.textContent='Create Administrator Account';
    showAlert('Cannot reach server. Please try again.');
  }
}

init();
</script>
</body>
</html>
